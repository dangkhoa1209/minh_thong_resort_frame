<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Detail - Abel Dang Production</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/pages/project.css">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
</head>

<body oncontextmenu="return false;">
  <div class="popup-overlay" id="popup">
    <span class="popup-close" id="popupClose">✕</span>
  </div>

  <div id="place-header"></div>
  <div class="container">
    <section class="banner">
      <img class="banner__img" src="../../assets/images/pear-hoi-an/1.webp" alt="Resort image">
    </section>

    <section class="about px py">
      <div class="about__container">
        <div class="about__info">
          <h2 class="about__title about__title--thin font-style-montserrat">Project</h2>
          <h2 class="about__title about__title--bold font-style-montserrat">Detail</h2>

          <div class="about__meta">
            <p><span class="font-bold">Location : </span> <span class="font-thin">Updating...</span></p>
            <p><span class="font-bold">Year</span> <span class="font-thin">----</span></p>
          </div>
        </div>

        <div class="about__content">
          <p>Project content is being loaded.</p>
        </div>
      </div>
    </section>

    <div class="space"></div>

    <section class="products px">
      <div class="product">
        <div class="product-item ratio-16-9">
          <img loading="lazy" src="../../assets/images/pear-hoi-an/2.webp" class="product-thumbnail" alt="">
        </div>
      </div>
    </section>

    <div id="place-slide-project"></div>
    <div id="place-footer"></div>
  </div>

  <script src="../../js/plugins/base-path.js"></script>
  <script src="../../js/plugins/component-loader.js"></script>
  <script src="../../js/pages/project.js"></script>
</body>

</html>
